<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AutoGo Rent a Car: consulta vehículos disponibles, renta en línea y gestiona tus alquileres.">
    <meta name="theme-color" content="#151b38">
    <title>AutoGo Rent a Car</title>

    <!-- Aplica el modo noche antes de dibujar la página (evita el parpadeo) -->
    <script>
        try {
            if (localStorage.getItem('autogo-tema') === 'noche') {
                document.documentElement.setAttribute('data-tema', 'noche');
            }
        } catch (e) { }
    </script>

    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>

<body>

    <!-- ICONO DEL VEHÍCULO -->
    <svg width="0" height="0" style="position:absolute;" aria-hidden="true">
        <defs>
            <symbol id="auto" viewBox="0 0 64 36">
                <path d="M10 6c2-4 6-6 10-6h24c4 0 8 2 10 6l4 8c4 1 6 4 6 8v6c0 2-2 3-4 3h-3a7 7 0 0 1-14 0H25a7 7 0 0 1-14 0H6c-2 0-4-1-4-3v-6c0-4 2-7 6-8zm8 2-4 7h36l-4-7zM18 34a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm28 0a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/>
            </symbol>
        </defs>
    </svg>

    <!-- FONDO -->
    <div class="fondo" aria-hidden="true"></div>

    <!-- APLICACIÓN -->
    <div id="raiz"></div>

    <noscript>
        <p class="sin-js">AutoGo necesita JavaScript activado para funcionar.</p>
    </noscript>

    <script src="js/config.js?v=3"></script>
    <script src="js/ui.js?v=3"></script>
    <script src="js/demo.js?v=3"></script>
    <script src="js/api.js?v=3"></script>
    <script src="js/app.js?v=3"></script>

    <!-- Banner de la pantalla de Inicio: ajusta su alto al saludo + tarjetas -->
    <script>
        (function () {
            var raiz = document.getElementById('raiz');
            var pendiente = false;

            function ajustarBanner() {
                pendiente = false;
                var main = document.querySelector('.main');
                if (!main) return;
                var ruta = (location.hash.split('/')[1] || '').split('?')[0];
                var kpis = main.querySelector('.kpis');
                var top = main.querySelector('.topbar');
                if (ruta !== 'inicio' || !kpis || !top) {
                    main.classList.remove('hero-on');
                    return;
                }
                main.classList.add('hero-on');

                // Mueve "Rentar un vehículo" a la fila de tarjetas
                var btn = Array.prototype.slice.call(top.querySelectorAll('a, button'))
                    .filter(function (el) { return /rentar/i.test(el.textContent); })[0];
                if (btn) {
                    btn.classList.add('kpi-accion');
                    kpis.insertBefore(btn, kpis.firstChild);
                }
                var alto = kpis.offsetTop + kpis.offsetHeight + 16 - 18;
                main.style.setProperty('--hero-h', alto + 'px');
            }

            function programar() {
                if (pendiente) return;
                pendiente = true;
                requestAnimationFrame(ajustarBanner);
            }

            // Ruta del catálogo: se toma del enlace "Ver vehículos disponibles" cuando aparece
            var rutaCatalogo = '#/catalogo';

            // Mensaje para invitar al cliente a ver el catálogo (login y registro)
            function mensajeCatalogo() {
                var enlace = Array.prototype.slice.call(
                    document.querySelectorAll('a[href*="catalogo"], a[href*="vehiculos"], a[href*="disponibles"]')
                ).filter(function (a) { return !a.closest('.marca') && !a.closest('.auth-promo'); })[0];
                if (enlace && enlace.getAttribute('href')) rutaCatalogo = enlace.getAttribute('href');

                var foto = document.querySelector('.auth-foto');
                if (!foto) return;

                // El logo ya no lleva al catálogo: se quita el enlace
                var marca = foto.querySelector('.marca');
                if (marca) {
                    Array.prototype.forEach.call(marca.querySelectorAll('a'), function (a) {
                        a.removeAttribute('href');
                        a.setAttribute('tabindex', '-1');
                        a.style.pointerEvents = 'none';
                        a.style.cursor = 'default';
                    });
                    marca.style.cursor = 'default';
                }

                if (foto.querySelector('.auth-promo')) return;
                var p = foto.querySelector('p');
                if (!p) return;

                // Solo el botón verde (sin título ni texto)
                var caja = document.createElement('div');
                caja.className = 'auth-promo';
                caja.innerHTML = '<a href="' + rutaCatalogo + '">Ver catálogo &rarr;</a>';
                p.parentNode.insertBefore(caja, p.nextSibling);
            }

            /* ---------------------------------------------------------
               ENGRANAJE ELIMINADO → acciones en el menú lateral
               (Cambiar contraseña · Modo noche · Cerrar sesión)
            --------------------------------------------------------- */
            var SVG = function (d) {
                return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
            };
            var ICONOS = {
                clave: SVG('<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
                luna: SVG('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
                sol: SVG('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
                salir: SVG('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>')
            };

            function esNoche() {
                return document.documentElement.getAttribute('data-tema') === 'noche';
            }

            function pintarTema(a) {
                var noche = esNoche();
                a.innerHTML = (noche ? ICONOS.sol : ICONOS.luna) + '<span>' + (noche ? 'Modo día' : 'Modo noche') + '</span>';
                a.title = noche ? 'Cambiar a modo día' : 'Cambiar a modo noche';
            }

            function alternarTema() {
                var noche = !esNoche();
                if (noche) document.documentElement.setAttribute('data-tema', 'noche');
                else document.documentElement.removeAttribute('data-tema');
                try { localStorage.setItem('autogo-tema', noche ? 'noche' : 'dia'); } catch (e) { }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', noche ? '#05070f' : '#151b38');
                Array.prototype.forEach.call(document.querySelectorAll('.nav-extra[data-accion="tema"]'), pintarTema);
            }

            // Quita el engranaje de la esquina del banner (se deja en el DOM, oculto)
            function ocultarEngranaje() {
                var top = document.querySelector('.main .topbar');
                if (!top || top.querySelector('.gear-oculto')) return;
                var botones = Array.prototype.slice.call(top.querySelectorAll('.icon-btn'))
                    .filter(function (b) { return !b.classList.contains('campana') && !b.closest('.campana'); });
                if (!botones.length) return;
                var gear = botones.filter(function (b) {
                    return /ajust|config|herram|menu|menú|opci|usuario|cuenta/i
                        .test((b.getAttribute('aria-label') || '') + ' ' + (b.title || ''));
                })[0] || botones[botones.length - 1];
                gear.classList.add('gear-oculto');
            }

            // Crea los 3 botones debajo de "Mi perfil"
            function crearAcciones() {
                var nav = document.querySelector('.app .nav');
                if (!nav || nav.querySelector('.nav-extra')) return;
                var defs = [
                    { id: 'clave', cls: 'primero', html: ICONOS.clave + '<span>Cambiar contraseña</span>', title: 'Cambiar contraseña' },
                    { id: 'tema', cls: '', html: '', title: '' },
                    { id: 'salir', cls: 'salir', html: ICONOS.salir + '<span>Cerrar sesión</span>', title: 'Cerrar sesión' }
                ];
                defs.forEach(function (d) {
                    var a = document.createElement('a');
                    a.href = '#';
                    a.setAttribute('role', 'button');
                    a.className = 'nav-extra ' + d.cls;
                    a.setAttribute('data-accion', d.id);
                    if (d.id === 'tema') pintarTema(a);
                    else { a.innerHTML = d.html; a.title = d.title; }
                    nav.appendChild(a);
                });
            }

            // Usa el menú original (oculto) para no perder la lógica de la app
            function usarMenuOriginal(patron) {
                var origen = document.querySelector('.gear-oculto') || document.querySelector('.side-pie .yo');
                if (!origen) return;
                document.body.classList.add('menu-oculto');
                var intentos = 0;

                function terminar() {
                    var m = document.querySelector('.menu-usuario');
                    if (m && m.parentNode) m.parentNode.removeChild(m);
                    setTimeout(function () { document.body.classList.remove('menu-oculto'); }, 150);
                }

                function buscar() {
                    var menu = document.querySelector('.menu-usuario');
                    var item = menu && Array.prototype.slice.call(menu.querySelectorAll('a, button'))
                        .filter(function (el) { return patron.test(el.textContent); })[0];
                    if (item) {
                        item.click();
                        setTimeout(function () {
                            if (document.querySelector('.menu-usuario')) terminar();
                            else document.body.classList.remove('menu-oculto');
                        }, 80);
                    } else if (++intentos < 12) {
                        setTimeout(buscar, 30);
                    } else {
                        terminar();
                    }
                }

                origen.click();
                buscar();
            }

            document.addEventListener('click', function (e) {
                var el = e.target.closest && e.target.closest('.nav-extra');
                if (!el) return;
                e.preventDefault();
                var accion = el.getAttribute('data-accion');
                if (accion === 'tema') alternarTema();
                else if (accion === 'clave') usarMenuOriginal(/contrase|segur/i);
                else if (accion === 'salir') usarMenuOriginal(/cerrar|salir/i);
            });

            function acciones() {
                ocultarEngranaje();
                crearAcciones();
            }

            new MutationObserver(function () { acciones(); mensajeCatalogo(); programar(); }).observe(raiz, { childList: true, subtree: true });
            // Respaldo: cualquier clic en el logo de la pantalla de acceso se ignora
            document.addEventListener('click', function (e) {
                if (e.target.closest && e.target.closest('.auth-foto .marca')) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            window.addEventListener('hashchange', function () { mensajeCatalogo(); programar(); });
            window.addEventListener('resize', programar);
            window.addEventListener('load', mensajeCatalogo);

            // Al cargar: la pantalla puede estar ya dibujada, así que se coloca el botón de inmediato
            acciones();
            mensajeCatalogo();
            setTimeout(acciones, 150);
            setTimeout(mensajeCatalogo, 150);
            setTimeout(mensajeCatalogo, 600);
            programar();
        })();
    </script>

    <!-- Modo noche en la pantalla de acceso (botón arriba a la derecha) -->
    <script>
        (function () {
            var raiz = document.getElementById('raiz');
            var LUNA = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
            var SOL = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

            function noche() { return document.documentElement.getAttribute('data-tema') === 'noche'; }

            function pintar(b) {
                b.innerHTML = noche() ? SOL : LUNA;
                b.title = noche() ? 'Cambiar a modo día' : 'Cambiar a modo noche';
                b.setAttribute('aria-label', b.title);
            }

            function crear() {
                var auth = document.querySelector('.auth');
                if (!auth || auth.querySelector('.tema-login')) return;
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'icon-btn cuadro tema-login';
                pintar(b);
                auth.appendChild(b);
            }

            document.addEventListener('click', function (e) {
                var b = e.target.closest && e.target.closest('.tema-login');
                if (!b) return;
                var n = !noche();
                if (n) document.documentElement.setAttribute('data-tema', 'noche');
                else document.documentElement.removeAttribute('data-tema');
                try { localStorage.setItem('autogo-tema', n ? 'noche' : 'dia'); } catch (err) { }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', n ? '#05070f' : '#151b38');
                pintar(b);
            });

            new MutationObserver(crear).observe(raiz, { childList: true, subtree: true });
            crear();
        })();
    </script>

     <link rel="stylesheet" href="
     styles1.css?v=3">

</body>

</html>
